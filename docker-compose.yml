services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dobox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dobox
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dobox -d dobox" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://dobox:${POSTGRES_PASSWORD}@db:5432/dobox
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://dobox:${POSTGRES_PASSWORD}@db:5432/dobox
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/www/dobox-frontend/dist:/srv/dobox:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
